#CONFIG_GPIO=y                 
#"Already enabled in defconfig file"

CONFIG_LOG=y                    #Enabling Logger Module for prirotizing UART Threads.
#CONFIG_SERIAL=y               "Already enabled in defconfig file"

CONFIG_UART_ASYNC_API=y
CONFIG_PRINTK=y

CONFIG_I2C=y                   #ENABLING I2C SUPPORT FOR THE APPLICATION

#For enabling entropy driver to generate a random number based on the 
#cryptographic hardware available in the chip, driver is selected automatically by the build system.
CONFIG_ENTROPY_GENERATOR=y       

#HEAP MEMORY POLL SIZE IS ALREADY DEFINED IN KCONFIG FILE /home/musman/ncs/nrfSDK/nrf/subsys/bluetooth/rpc/Kconfig
CONFIG_HEAP_MEM_POOL_SIZE=4096 

        
CONFIG_TIMESLICING=n           # Disabling time slicing For same priority of threads
#CONFIG_TIMESLICE_SIZE=5000     # Each thread is allocated execution time of 1second, it is also defined in defconfig file
# CONFIG_TIMESLICE_PRIORITY=0 This value is set by default to 0

CONFIG_TIMING_FUNCTIONS=y


#Enabling C++ Support
CONFIG_CPP=y

#ENABLING LIBC++ SUPPORT AS Zephyr does not include any C++ standard library implementation in source code form. 
CONFIG_GLIBCXX_LIBCPP=y


#ENABLING C++17 SUPPORT
CONFIG_STD_CPP17=y

CONFIG_UART_FUNC=y
CONFIG_LED_FUNC=y
CONFIG_BME680_FUNC=y

CONFIG_CBPRINTF_FP_SUPPORT=y