#CONFIG_GPIO=y                 "Already enabled in defconfig file"
CONFIG_LOG=n                   #Disabling Logger Module for prirotizing UART Threads.
#CONFIG_SERIAL=y               "Already enabled in defconfig file"
CONFIG_UART_ASYNC_API=y
CONFIG_PRINTK=y
CONFIG_UART_FUNC=y
CONFIG_TIMESLICING=y           # Enabling time slicing For same priority of threads
#CONFIG_TIMESLICE_SIZE=5000     # Each thread is allocated execution time of 1second, it is also defined in defconfig file
# CONFIG_TIMESLICE_PRIORITY=0 This value is set by default to 0
CONFIG_LED_FUNC=y
